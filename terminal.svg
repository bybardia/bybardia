<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Bardia system profile terminal</title>
<desc id="desc">A macOS-style terminal window showing Bardia's technical focus</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101722"/><stop offset="1" stop-color="#0b111a"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<g filter="url(#shadow)">
  <rect x="20" y="20" width="960" height="390" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <path d="M20 74H980" stroke="#30363d" stroke-width="2"/>
  <circle cx="52" cy="47" r="8" fill="#ff5f57"/>
  <circle cx="78" cy="47" r="8" fill="#febc2e"/>
  <circle cx="104" cy="47" r="8" fill="#28c840"/>
  <text x="500" y="53" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" text-anchor="middle">bardia@github — ~/profile</text>

  <text x="52" y="112" fill="#39d98a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">bardia@github:~/profile$</text>
  <text x="305" y="112" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">whoami</text>

  <text x="52" y="150" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">name</text>
  <text x="190" y="150" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">Bardia</text>
  <text x="52" y="181" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">role</text>
  <text x="190" y="181" fill="#58a6ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">Systems Builder &amp; Open-Source Explorer</text>
  <text x="52" y="212" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">status</text>
  <text x="190" y="212" fill="#39d98a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">● building in public</text>

  <text x="52" y="263" fill="#39d98a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">bardia@github:~/profile$</text>
  <text x="305" y="263" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">cat focus.txt</text>

  <text x="52" y="301" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">›</text>
  <text x="82" y="301" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">Trustworthy AI Agents</text>
  <text x="52" y="332" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">›</text>
  <text x="82" y="332" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">Linux &amp; Virtualized Environments</text>
  <text x="500" y="301" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">›</text>
  <text x="530" y="301" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">AI-Assisted Development</text>
  <text x="500" y="332" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">›</text>
  <text x="530" y="332" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">Decentralized Applications</text>

  <text x="52" y="378" fill="#39d98a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">bardia@github:~/profile$</text>
  <rect x="305" y="362" width="10" height="21" fill="#e6edf3" opacity=".9"/>
</g>
</svg>