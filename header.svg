<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Bardia — Systems Builder</title>
  <desc id="desc">A dark terminal-inspired banner for Bardia's GitHub profile</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.52" stop-color="#0d1726"/><stop offset="1" stop-color="#07131a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#39d98a"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7d8590" stroke-opacity="0.08"/></pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="url(#grid)"/>
  <circle cx="38" cy="30" r="6" fill="#ff5f57"/><circle cx="60" cy="30" r="6" fill="#febc2e"/><circle cx="82" cy="30" r="6" fill="#28c840"/>
  <text x="600" y="35" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">bardia@github: ~/profile</text>
  <path d="M0 58H1200" stroke="#30363d"/>
  <text x="72" y="112" fill="#39d98a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">$ whoami</text>
  <text x="72" y="184" fill="#f0f6fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="750" letter-spacing="2">BARDIA</text>
  <rect x="72" y="206" width="505" height="5" rx="2.5" fill="url(#accent)" filter="url(#glow)"/>
  <text x="72" y="250" fill="#b1bac4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">SYSTEMS BUILDER  //  OPEN-SOURCE EXPLORER</text>
  <text x="72" y="292" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">python · linux · virtualization · ai agents · onchain</text>
  <g transform="translate(905 126)">
    <circle cx="92" cy="45" r="92" fill="#58a6ff" opacity="0.05"/><circle cx="92" cy="45" r="68" fill="none" stroke="#58a6ff" stroke-opacity="0.22"/><circle cx="92" cy="45" r="43" fill="none" stroke="#39d98a" stroke-opacity="0.40" stroke-dasharray="8 8"/>
    <path d="M38 45h108M92-9v108" stroke="#58a6ff" stroke-opacity="0.28"/>
    <circle cx="92" cy="45" r="10" fill="#39d98a" filter="url(#glow)"/><circle cx="38" cy="45" r="5" fill="#58a6ff"/><circle cx="146" cy="45" r="5" fill="#58a6ff"/><circle cx="92" cy="-9" r="5" fill="#39d98a"/><circle cx="92" cy="99" r="5" fill="#39d98a"/>
  </g>
</svg>
