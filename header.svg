<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Bardia — Build, Break, Learn, Repeat</title>
<desc id="desc">A futuristic mission-control banner for Bardia's GitHub profile</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090714"/><stop offset=".52" stop-color="#11112a"/><stop offset="1" stop-color="#07141d"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a78bfa"/><stop offset=".5" stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  <radialGradient id="orb"><stop stop-color="#5eead4" stop-opacity=".55"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c4b5fd" opacity=".12"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="380" rx="26" fill="url(#bg)"/>
<rect width="1200" height="380" rx="26" fill="url(#dots)"/>
<path d="M0 64H1200M790 64V380" stroke="#c4b5fd" stroke-opacity=".13"/>
<text x="44" y="40" fill="#8b8aa7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">MISSION CONTROL / PUBLIC BUILD LOG</text>
<circle cx="1122" cy="32" r="5" fill="#5eead4" filter="url(#glow)"/><text x="1140" y="38" fill="#5eead4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">ONLINE</text>
<text x="58" y="126" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">OPERATOR_01</text>
<text x="58" y="213" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="4">BARDIA</text>
<rect x="58" y="235" width="620" height="5" rx="3" fill="url(#neon)" filter="url(#glow)"/>
<text x="58" y="284" fill="#d5d3e8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22">BUILD  /  BREAK  /  LEARN  /  REPEAT</text>
<text x="58" y="328" fill="#8b8aa7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">AI SYSTEMS · LINUX · VIRTUALIZATION · ONCHAIN</text>
<g transform="translate(850 108)">
  <circle cx="115" cy="90" r="128" fill="url(#orb)" opacity=".25"/>
  <circle cx="115" cy="90" r="92" fill="none" stroke="#a78bfa" stroke-opacity=".35"/>
  <circle cx="115" cy="90" r="68" fill="none" stroke="#5eead4" stroke-opacity=".55" stroke-dasharray="2 10"/>
  <circle cx="115" cy="90" r="42" fill="none" stroke="#60a5fa" stroke-opacity=".5"/>
  <path d="M23 90h184M115-2v184" stroke="#c4b5fd" stroke-opacity=".18"/>
  <path d="M63 38l104 104M167 38L63 142" stroke="#c4b5fd" stroke-opacity=".12"/>
  <circle cx="115" cy="90" r="13" fill="#5eead4" filter="url(#glow)"/>
  <circle cx="115" cy="-2" r="5" fill="#a78bfa"/><circle cx="207" cy="90" r="5" fill="#60a5fa"/><circle cx="115" cy="182" r="5" fill="#5eead4"/>
</g>
</svg>
