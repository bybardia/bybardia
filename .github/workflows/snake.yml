name: Generate Snake

on:
  # Run automatically every day
  schedule:
    - cron: "0 0 * * *"
  # Allow manual run from the Actions tab
  workflow_dispatch:
  # Also run on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: bybardia
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=39d98a&color_dots=161b22,0e4429,006d32,26a641,39d353

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
