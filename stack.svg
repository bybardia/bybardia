    <text x="734" y="157" fill="#e6edf3" font-size="16" font-weight="700">AI Agents</text><text x="734" y="177" fill="#7d8590" font-size="12">Gemini · structured output</text>

    <rect x="672" y="204" width="132" height="60" rx="10" fill="#151d29" stroke="#263142"/>
    <rect x="687" y="218" width="32" height="32" rx="8" fill="url(#purple)"/><text x="703" y="240" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">M</text>
