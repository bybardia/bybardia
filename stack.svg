    <rect x="648" y="328" width="300" height="55" rx="10" fill="#111827" stroke="#4338ca" stroke-opacity=".65"/>
    <text x="669" y="361" fill="#c4b5fd" font-size="15" font-weight="700">↗ AI-Assisted Development</text>
